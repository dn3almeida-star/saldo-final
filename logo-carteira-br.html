<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d13">
  <title>Logo carteira · Saldo Final</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 35%, #1b2a3a 0, #090d13 58%);
      color: #f6f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(620px, 100%); text-align: center; }
    a { color: #a8b1c0; text-decoration: none; font-size: 14px; }
    .mark { display: block; width: min(92vw, 560px); height: auto; margin: 24px auto 18px; }
    h1 { margin: 0; font-size: clamp(22px, 6vw, 32px); letter-spacing: -.03em; }
    p { margin: 8px 0 0; color: #a8b1c0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <a href="/logo-preview.html">← Voltar para as outras propostas</a>
    <img class="mark" src="assets/logo-wallet-brazil-preview.png" alt="Logo de uma carteira azul com uma nota verde estilizada de 100 reais">
    <h1>Logo carteira</h1>
    <p>Prévia da carteira com nota brasileira estilizada.</p>
  </main>
</body>
</html>
