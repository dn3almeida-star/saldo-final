<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Variações da carteira · Saldo Final</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100svh; padding: 28px 18px 38px; background: #080b10; color: #f7f9fc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(980px, 100%); margin: 0 auto; }
    header { margin: 4px auto 28px; max-width: 620px; text-align: center; }
    .eyebrow { color: #43c8ff; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(28px, 7vw, 46px); letter-spacing: -.04em; }
    p { margin: 10px 0 0; color: #aab7c7; font-size: 15px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .option { display: flex; min-height: 100%; flex-direction: column; overflow: hidden; border: 1px solid #263545; border-radius: 22px; background: #111923; color: inherit; text-decoration: none; transition: border-color .2s ease, transform .2s ease; }
    .option:hover { border-color: #43c8ff; transform: translateY(-2px); }
    .option img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #080b10; }
    .copy { padding: 15px 16px 17px; }
    h2 { margin: 0; font-size: 18px; }
    .copy p { margin-top: 5px; font-size: 13px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; gap: 16px; } .option { display: grid; grid-template-columns: 42% 1fr; align-items: center; } .option img { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Saldo Final · propostas</div>
      <h1>Três novas carteiras</h1>
      <p>Abra cada versão separadamente. Nenhuma delas foi aplicada ao aplicativo ainda.</p>
    </header>
    <section class="grid" aria-label="Variações de logo">
      <a class="option" href="/logo-carteira-grafite.html"><img src="assets/wallet-grafite.png" alt="Carteira grafite e preta"><div class="copy"><h2>1 · Grafite preto</h2><p>Fosco, técnico e discreto.</p></div></a>
      <a class="option" href="/logo-carteira-petroleo.html"><img src="assets/wallet-petroleo.png" alt="Carteira preta com costura preta"><div class="copy"><h2>2 · Costura aparente</h2><p>Couro preto com textura mais marcada.</p></div></a>
      <a class="option" href="/logo-carteira-preta-prata.html"><img src="assets/wallet-preta-prata.png" alt="Carteira preta integral"><div class="copy"><h2>3 · Preta integral</h2><p>Mais sóbria e minimalista.</p></div></a>
    </section>
  </main>
</body>
</html>
