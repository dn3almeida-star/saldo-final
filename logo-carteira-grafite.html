<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Carteira grafite · Saldo Final</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px 18px; background: radial-gradient(circle at 50% 25%, #172738 0, #080b10 62%); color: #f7f9fc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(620px, 100%); text-align: center; }
    a { color: #aab7c7; text-decoration: none; font-size: 14px; }
    a:hover { color: #43c8ff; }
    .eyebrow { margin: 34px 0 10px; color: #43c8ff; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 42px); letter-spacing: -.04em; }
    p { margin: 10px auto 0; max-width: 42ch; color: #aab7c7; font-size: 15px; line-height: 1.5; }
    .mark { display: block; width: min(92vw, 560px); height: auto; margin: 20px auto 12px; }
    .swatches { display: inline-flex; gap: 8px; align-items: center; margin-top: 18px; padding: 8px 12px; border: 1px solid #263545; border-radius: 999px; background: #111923; color: #aab7c7; font-size: 13px; }
    .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
    .graphite { background: #20252b; } .charcoal { background: #111316; } .red { background: #e83b42; }
  </style>
</head>
<body>
  <main>
    <a href="/logo-carteira-variacoes.html">← Ver as três versões</a>
    <div class="eyebrow">Versão 1</div>
    <h1>Grafite de cockpit</h1>
    <p>Carteira grafite/preta fosca, costura preta e fecho vermelho discreto.</p>
    <img class="mark" src="assets/wallet-grafite.png" alt="Logo de carteira grafite com costura preta e nota azul estilizada de 100 reais">
    <div class="swatches"><span class="swatch graphite"></span><span class="swatch charcoal"></span><span class="swatch red"></span> grafite · carvão · vermelho</div>
  </main>
</body>
</html>
